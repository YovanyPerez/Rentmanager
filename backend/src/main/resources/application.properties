spring.application.name=rentmanager-api

# Datasource — dev defaults for the Docker Compose MySQL; override with environment variables elsewhere.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentmanager}
spring.datasource.username=${DB_USER:rentmanager}
spring.datasource.password=${DB_PASSWORD:rentmanager}

# The schema is owned by database/01_schema.sql; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Property image uploads (local disk; cloud storage is a Phase 17 item).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.uploads.dir=${UPLOADS_DIR:./uploads}

# JWT (HMAC-SHA256; secret must be at least 32 bytes). Override in every other environment.
security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
security.jwt.ttl-minutes=${JWT_TTL_MINUTES:480}

# Development convenience: creates an ADMIN account on startup if it does not exist.
# Disable (ADMIN_SEED_ENABLED=false) in production.
app.admin.enabled=${ADMIN_SEED_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@rentmanager.local}
app.admin.password=${ADMIN_PASSWORD:admin1234}
